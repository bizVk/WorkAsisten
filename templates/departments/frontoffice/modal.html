<div class="reservation-modal" id="reservationModal">

    <div class="modal-content">

        <div class="modal-header">
            <h2>Reservation Details</h2>

            <button
                id="closeModal"
                type="button"
                aria-label="Close Reservation Details">
                ×
            </button>
        </div>

        <div class="modal-body">

            <div class="detail-row">
                <span>Reservation ID</span>
                <strong id="modalReservationId"></strong>
            </div>

            <div class="detail-row">
                <span>Guest Name</span>
                <strong id="modalGuestName"></strong>
            </div>

            <div class="detail-row">
                <span>Guest ID</span>
                <strong id="modalGuestId"></strong>
            </div>

            <div class="detail-row">
                <span>Room Number</span>
                <strong id="modalRoom"></strong>
            </div>

            <div class="detail-row">
                <span>Room Category</span>
                <strong id="modalCategory"></strong>
            </div>

            <div class="detail-row">
                <span>Check-In Date</span>
                <strong id="modalCheckin"></strong>
            </div>

            <div class="detail-row">
                <span>Check-Out Date</span>
                <strong id="modalCheckout"></strong>
            </div>

            <div class="detail-row">
                <span>Reservation Status</span>
                <strong id="modalStatus"></strong>
            </div>

            <div class="detail-row">
                <span>Booking Source</span>
                <strong id="modalSource"></strong>
            </div>

            <div class="detail-row">
                <span>Payment Status</span>
                <strong id="modalPaymentStatus"></strong>
            </div>

            <div class="detail-row">
                <span>Advance Received</span>
                <strong id="modalAdvance"></strong>
            </div>

            <div class="detail-row">
                <span>Outstanding Balance</span>
                <strong id="modalBalance"></strong>
            </div>

            <div class="detail-row">
                <span>Special Request</span>
                <strong id="modalRequest"></strong>
            </div>

            <div class="detail-row">
                <span>Reservation Notes</span>
                <strong id="modalReservationNotes"></strong>
            </div>

            <div class="detail-row">
                <span>Front Office Notes</span>
                <strong id="modalFrontofficeNotes"></strong>
            </div>

        </div>

    </div>

</div>
